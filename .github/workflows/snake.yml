name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # 每 12 小时更新一次
  workflow_dispatch:          # 允许手动运行

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6a5cff&color_dots=#ebedf0,#d6d2ff,#a9a1ff,#8b80ff,#6a5cff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#1fb8e6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
